<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
  <title>Mascote</title>
  <link rel="stylesheet" href="mascot.css" />
</head>
<body data-theme="dark">
  <div class="bubble" id="bubble" role="status"></div>
  <div class="hp" id="hp" hidden>
    <div class="hp-bar hp-session"><i id="hpSession"></i></div>
    <div class="hp-bar hp-weekly"><i id="hpWeekly"></i></div>
  </div>
  <div class="actor" id="actor">
    <div class="squash" id="squash">
      <canvas id="sprite" width="16" height="15"></canvas>
    </div>
  </div>
  <script src="../shared/mascotSprites.js"></script>
  <script src="mascot.js"></script>
</body>
</html>
