<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
  <title>Claude Usage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <div class="widget init" id="widget">
    <div class="panel" id="panel">
      <div class="panel-inner" id="panelInner">
        <header class="head">
          <span class="head-title">Uso do Claude</span>
          <span class="head-status" id="status"></span>
        </header>
        <section class="card" id="card-session"></section>
        <section class="card" id="card-weekly"></section>
        <section class="models" id="models"></section>
        <footer class="foot">
          <span id="updated"></span>
          <button id="refreshBtn" title="Atualizar agora" aria-label="Atualizar agora">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          </button>
        </footer>
      </div>
    </div>
    <div class="tab" id="tab">
      <div class="gauge" id="gauge-session"></div>
      <div class="gauge" id="gauge-weekly"></div>
    </div>
  </div>
  <script src="../shared/format.js"></script>
  <script src="logo.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
